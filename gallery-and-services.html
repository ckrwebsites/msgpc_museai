/* Gallery & Services page */
#gs-services{padding-top:4rem;padding-bottom:1rem;background:#ebeff2;}
.gs-card{background:#fff;border-radius:12px;padding:1.75rem;height:100%;box-shadow:0 2px 12px rgba(0,0,0,.07);border-top:4px solid #8b0000;}
.gs-card h5{color:#200960;margin-bottom:.75rem;}
.gs-card p{color:#333;margin-bottom:0;}
#gs-gallery{padding-top:3rem;padding-bottom:4rem;}
#gs-cta{padding-top:1rem;padding-bottom:5rem;background:#ebeff2;}
.gs-cta-card{border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.15);max-width:440px;margin:0 auto;}
.gs-cta-photo img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;}
.gs-cta-box{background:#8b0000;text-align:center;padding:2.5rem 2rem 2.75rem;}
.gs-cta-icon{width:52px;height:52px;margin-bottom:1rem;}
.gs-cta-box h3{color:#fff;margin-bottom:1.5rem;}
.gs-cta-btn{background:#fff !important;color:#333 !important;border-radius:999px !important;padding:.8rem 2.75rem !important;font-weight:700 !important;letter-spacing:.06em;border:none !important;}
.gs-cta-btn:hover{background:#f0f0f0 !important;}

/* Service boxes (Primal-style) */
#gs-services{padding-top:4rem;padding-bottom:4rem;background:#ebeff2;}
.gs-svc-box{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08);height:100%;}
.gs-minicar .carousel-item img{width:100%;aspect-ratio:16/10;object-fit:cover;}
.gs-minicar{position:relative;}
.gs-minicar-count{position:absolute;bottom:.75rem;right:.75rem;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:.15rem .6rem;border-radius:999px;}
.gs-minicar .carousel-control-prev,.gs-minicar .carousel-control-next{width:2.5rem;opacity:.9;}
.gs-svc-body{padding:1.75rem;}
.gs-svc-label{color:#8b0000;font-weight:700;font-size:.8rem;letter-spacing:.08em;margin-bottom:.5rem;}
.gs-svc-body h3{color:#200960;margin-bottom:.75rem;}
.gs-svc-body p{color:#333;}
.gs-svc-bullets{list-style:none;padding:0;margin:1rem 0;display:grid;grid-template-columns:1fr 1fr;gap:.35rem;}
.gs-svc-bullets li{font-size:.92rem;color:#444;padding-left:1.2rem;position:relative;}
.gs-svc-bullets li::before{content:"\2713";position:absolute;left:0;color:#8b0000;font-weight:700;}
.gs-explore{display:inline-block;margin-top:.5rem;color:#8b0000;font-weight:700;text-decoration:none;font-size:1.05rem;}
.gs-explore:hover{color:#200960;text-decoration:underline;}
